<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeakHands - Inicio de Sesión</title>
    <link rel="stylesheet" href="/static/css/Style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Encabezado con logo -->
    <header>
        <div class="logo">SpeakHands</div>
        <div class="version">Versión Alpha</div>
    </header>

    <!-- Contenido principal -->
    <main>
        <div class="content">
            <div class="image-placeholder">
                <!-- Imagen ilustrativa -->
                <img src="/static/images/imagen.png" alt="Ilustración de ayuda" class="illustration">
            </div>
            <div class="text-content">
                <h1>¡Hablemos con las manos, comuniquemos con el corazón!</h1>

                <!-- Botones de acción -->
                <button class="btn-primary" id="registerButton">Crear una Cuenta</button>
                <button class="btn-secondary" id="loginButton">Iniciar Sesión</button>

                <!-- Formulario de inicio de sesión -->
                <div id="loginModal" class="modal">
                    <div class="modal-content">
                        <span class="close">&times;</span>
                        <h2>Iniciar Sesión</h2>
                        <form action="/login" method="POST">
                            <div class="form-group">
                                <label for="username">Usuario:</label>
                                <input type="text" id="username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Contraseña:</label>
                                <input type="password" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn-login">Ingresar</button>
                        </form>

                        <!-- Mensaje de error si las credenciales son incorrectas -->
                        {% if error %}
                        <div class="error-message">
                            <p>{{ error }}</p>
                        </div>
                        {% endif %}
                    </div>
                </div>

                <!-- Formulario de creación de cuenta -->
                <div id="registerModal" class="modal-2">
                    <div class="modal-content-2">
                        <span class="close-2">&times;</span>
                        <h2>Crear una Cuenta</h2>
                        <form action="/register" method="POST">
                            <div class="form-group">
                                <label for="new-name">Nombre:</label>
                                <input type="text" id="new-name" name="new-name" required>
                            </div>
                            <div class="form-group">
                                <label for="new-apellido">Apellido:</label>
                                <input type="text" id="new-apellido" name="new-apellido" required>
                            </div>
                            <div class="form-group">
                                <label for="new-username">Nombre de Usuario:</label>
                                <input type="text" id="new-username" name="new-username" required>
                            </div>
                            <div class="form-group">
                                <label for="new-email">Correo Electrónico:</label>
                                <input type="email" id="new-email" name="new-email" required>
                            </div>
                            <div class="form-group">
                                <label for="new-password">Contraseña:</label>
                                <input type="password" id="new-password" name="new-password" required>
                            </div>
                            <button type="submit" class="btn-register">Crear Cuenta</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
